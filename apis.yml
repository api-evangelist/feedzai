aid: feedzai
name: Feedzai
description: >-
  Feedzai is an AI-native, end-to-end financial crime prevention platform — the
  self-described "world's first RiskOps platform" — used by leading financial
  institutions to stop fraud, scams, and money laundering across the customer
  lifecycle. Its RiskOps platform unifies data, machine-learning models, real-time
  decisioning, case management, and reporting to cover account opening, transaction
  fraud, account takeover, scam prevention, KYC/CDD, AML transaction monitoring, and
  watchlist/sanctions screening. Feedzai protects over 900 million consumers and
  scores trillions of dollars of transactions, covering roughly 45% of US debit card
  activity. Its product APIs are delivered to enterprise customers through a
  contract/NDA-gated documentation portal; publicly it ships open-source model
  integration (OpenML) and developer tooling libraries, an RFC 9116 security.txt, an
  llms.txt, and a public status page.
